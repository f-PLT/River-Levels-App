services:
  api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: uv run --package river-api uvicorn river_api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DSN=postgresql://postgres:postgres@db:5432/river_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    command: uv run --package river-worker arq river_worker.worker.WorkerSettings --watch
    volumes:
      - .:/app
    environment:
      - POSTGRES_DSN=postgresql://postgres:postgres@db:5432/river_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis

  db:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=river_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
